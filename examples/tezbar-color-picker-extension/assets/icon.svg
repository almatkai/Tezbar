      <stop stop-color="#20283F"/>
      <stop offset="1" stop-color="#111524"/>
    </linearGradient>
    <linearGradient id="drop" x1="24" y1="18" x2="68" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
