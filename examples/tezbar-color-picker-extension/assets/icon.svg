<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Color Picker</title>
  <desc id="desc">An eyedropper over a vivid color swatch</desc>
  <defs>
