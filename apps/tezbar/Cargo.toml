[package]
name = "tezbar-native"
version = "0.3.0-beta.7"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false

[[bin]]
name = "tezbar"
path = "src/main.rs"

[features]
default = []
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
tezbar-core = { path = "../../crates/tezbar-core" }
anyhow = "1"
serde_json = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35", default-features = false, features = ["font-kit"] }
gpui_tokio = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35" }

[target.'cfg(target_os = "linux")'.dependencies]
proc-macro-crate = "=2.0.0"
