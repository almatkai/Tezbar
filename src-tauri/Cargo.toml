[package]
name = "tezbar"
version = "0.2.9-beta.11"
description = "A Tauri App"
authors = ["you"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
semver = "1.0"
base64 = "0.22"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "stream", "multipart", "query", "form"] }
log = "0.4"
open = "5"
tauri = { version = "2.11.2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-positioner = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
tauri-plugin-process = "2"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff"] }
portable-pty = "0.9"
alloc-stdlib = "=0.2.2"
brotli-decompressor = "=5.0.0"
tempfile = "3.27"
rusqlite = { version = "0.32.1", features = ["bundled", "load_extension"] }
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
regex = "1"
walkdir = "2"
unicode-normalization = "0.1"
futures-util = "0.3"
arboard = "=3.6.1"
notify = "8"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-graphics = { version = "0.23", features = ["highsierra"] }
core-foundation = "0.9"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-user-notifications = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }
