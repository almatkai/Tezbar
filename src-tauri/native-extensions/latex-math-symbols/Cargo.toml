[package]
name = "latex-math-symbols-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
description = "Offline Native V2 LateX Math Symbols engine and compiled adapter"
repository = "https://github.com/almatkai/latex-math-symbols"
include = ["/src/**", "/data/**", "/adapter/**", "/assets/**", "/tests/**", "/libraries/**", "/fixtures/own/LICENSE", "/*.json", "/*.md", "/LICENSE*", "/NOTICE*", "/Cargo.lock"]

[dependencies]
# Compatible ranges let the host retain its existing, newer locked dependencies.
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.16.0", features = ["v4"] }

[dev-dependencies]
