[package]
name = "tezbar-host"
version = "0.3.0-beta.15"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[dependencies]
tezbar-core = { path = "../tezbar-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
libc = "0.2"
sha2 = "0.10"
global-hotkey = "=0.8.0"
tray-icon = { version = "=0.23.1", default-features = false }
muda = { version = "=0.19.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3.27"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.9"
core-graphics = { version = "0.23", features = ["highsierra"] }
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-user-notifications = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }
# Toast notifications through WinRT (already locked transitively).
windows = { version = "0.61", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }
