[package]
name = "tezbar-ui-model"
version = "0.3.0-beta.9"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[features]
default = []
launcher-models = ["tezbar-core/native-ui-instant", "dep:html5ever"]
agent-models = []

[dependencies]
tezbar-update = { path = "../tezbar-update", default-features = false }

tezbar-core = { path = "../tezbar-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
url = "2"
base64 = "0.22"
unicode-normalization = "0.1"
html5ever = { version = "=0.29.1", optional = true }

[dev-dependencies]
tempfile = "3.27"
