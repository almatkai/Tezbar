[package]
name = "tezbar-ui"
version = "0.3.0-beta.7"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
tezbar-ui-model = { path = "../tezbar-ui-model", features = ["launcher-models"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35" }
accesskit = { version = "=0.24.1", features = ["enumn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"
image = { version = "0.25", default-features = false, features = ["png"] }
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
url = "2"
html5ever = "=0.29.1"

[dev-dependencies]
tempfile = "3.27"
gpui = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35", features = ["test-support"] }
