[package]
name = "tezbar-update"
version = "0.3.0-beta.7"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3.27"
base64 = "0.22"
minisign-verify = "=0.2.5"
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security"] }
