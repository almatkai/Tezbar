<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tezbar memory and CPU evidence</title>
<style>
html,body{margin:0;padding:0}#tezbar-memory-comparison{color:var(--foreground, CanvasText);font-family:var(--font-sans, system-ui);font-weight:400}#tezbar-memory-comparison h2{font:inherit;font-weight:500;margin:0 96px 16px 0}#tezbar-memory-comparison h3{font:inherit;font-weight:500;margin:0 0 8px}#tezbar-memory-comparison figure{margin:0 0 24px}#tezbar-memory-comparison .plot{height:160px}#tezbar-memory-comparison .row{display:grid;grid-template-columns:180px minmax(0,1fr) 94px;gap:12px;align-items:center;min-height:44px}#tezbar-memory-comparison .value{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}#tezbar-memory-comparison .track{height:16px;background:var(--muted, ButtonFace);position:relative}#tezbar-memory-comparison .bar{height:16px}#tezbar-memory-comparison .before{background:var(--muted-foreground, GrayText);opacity:.65}#tezbar-memory-comparison .after{background:var(--chart-1, Highlight)}#tezbar-memory-comparison .prototype{background:var(--chart-2, AccentColor);opacity:.8}#tezbar-memory-comparison .target{position:absolute;left:16.3385%;width:1px;top:-4px;height:24px;background:var(--destructive, CanvasText)}#tezbar-memory-comparison .axis{display:flex;justify-content:space-between;margin-left:192px;margin-right:106px;color:var(--muted-foreground, GrayText);font-variant-numeric:tabular-nums}#tezbar-memory-comparison figcaption{color:var(--muted-foreground, GrayText);margin-top:8px}#tezbar-memory-comparison .budget{color:var(--foreground, CanvasText)}#tezbar-memory-comparison .note{margin:0;color:var(--muted-foreground, GrayText)}@media(max-width:540px){#tezbar-memory-comparison .row{grid-template-columns:minmax(0,1fr) 94px;gap:4px 10px;min-height:64px}#tezbar-memory-comparison .label{grid-column:1/-1}#tezbar-memory-comparison .plot{height:220px}#tezbar-memory-comparison .axis{margin-left:0;margin-right:104px}}
</style></head><body>
<div id="tezbar-memory-comparison">
<h2>Retained memory and indexing CPU</h2>
<figure aria-label="Complete-family footprint after indexing, with the same model retained. Production remains above the memory target."><h3>Complete family footprint · MiB</h3><div class="plot"><div class="row"><span class="label">Baseline</span><div class="track"><div class="bar before" style="width:78.4060%"></div><span class="target" aria-hidden="true"></span></div><span class="value">509.64 </span></div>
<div class="row"><span class="label">Production CPU fix</span><div class="track"><div class="bar after" style="width:90.8844%"></div><span class="target" aria-hidden="true"></span></div><span class="value">590.75 </span></div>
<div class="row"><span class="label">Runtime prototype</span><div class="track"><div class="bar prototype" style="width:41.3543%"></div><span class="target" aria-hidden="true"></span></div><span class="value">268.80 </span></div><div class="axis"><span>0</span><span>650 MiB</span></div></div><figcaption><span class="budget">Target: 106.2 MiB</span> (vertical marks). Summed footprint ledgers, not deduplicated private RAM. Model retained.</figcaption></figure>
<figure aria-label="CPU work for saving 192 real vectors, including foreground requests. Wall time is essentially unchanged in production."><h3>CPU work for 192 vectors · CPU-seconds</h3><div class="plot"><div class="row"><span class="label">Baseline</span><div class="track"><div class="bar before" style="width:91.8021%"></div></div><span class="value">8.26 </span></div>
<div class="row"><span class="label">Production CPU fix</span><div class="track"><div class="bar after" style="width:23.0006%"></div></div><span class="value">2.07 </span></div>
<div class="row"><span class="label">Runtime prototype</span><div class="track"><div class="bar prototype" style="width:27.3859%"></div></div><span class="value">2.46 </span></div><div class="axis"><span>0</span><span>9 CPU-s</span></div></div><figcaption>Wall time: 9.44 → 9.41 s in production; 12.47 s for the runtime prototype.</figcaption></figure>
<p class="note">Production: two processes per version. Prototype: one isolated runtime rebuild, not enabled in production; first-use differences remain unresolved.</p>
</div></body></html>
